<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙和醫院四下志工管理系統</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>

<header>
    <h1>🏥 雙和醫院四下志工</h1>
    <p>志工管理系統 · 請假 · 代班 · 即時狀態</p>
    <div class="user-bar" id="userBar">
        <button onclick="login()">🔑 志工登入</button>
    </div>
</header>

<nav>
    <a href="#" class="active" data-tab="status">📋 即時狀態</a>
    <a href="#" data-tab="leave">📝 請假申請</a>
    <a href="#" data-tab="roster">👥 志工名冊</a>
    <a href="#" data-tab="contact">📞 聯絡群組</a>
    <a href="#" data-tab="admin" class="admin-only" style="display:none">⚙️ 管理</a>
</nav>

<div class="container" id="app">

    <!-- Tab: 即時狀態 -->
    <section id="tab-status" class="tab active">
        <h2 class="section-title">📋 即時請假狀態</h2>
        <p class="section-desc">今日志工出勤情況一覽，自動即時更新</p>
        <div id="statusBoard">
            <div class="loading">載入中...</div>
        </div>
    </section>

    <!-- Tab: 請假申請 -->
    <section id="tab-leave" class="tab">
        <h2 class="section-title">📝 請假申請</h2>
        <p class="section-desc">填寫請假單，送出後即時顯示於狀態板</p>
        <form id="leaveForm" class="card">
            <div class="form-row">
                <div class="form-group">
                    <label>志工姓名</label>
                    <select id="leaveVolunteer" required>
                        <option value="">請選擇</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>請假日期</label>
                    <input type="date" id="leaveDate" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>班別</label>
                    <select id="leaveShift" required>
                        <option value="">請選擇</option>
                        <option value="上午班 (09:00-13:00)">上午班 (09:00-13:00)</option>
                        <option value="下午班 (13:00-17:00)">下午班 (13:00-17:00)</option>
                        <option value="全天班 (09:00-17:00)">全天班 (09:00-17:00)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>是否需代班</label>
                    <select id="needSub">
                        <option value="不需要">不需要</option>
                        <option value="需要">需要代班</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>請假原因</label>
                <select id="leaveReason">
                    <option value="個人事由">個人事由</option>
                    <option value="身體不適">身體不適</option>
                    <option value="家庭因素">家庭因素</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>備註</label>
                <textarea id="leaveNote" rows="2" placeholder="補充說明（選填）"></textarea>
            </div>
            <button type="submit" class="btn-submit">✅ 送出請假申請</button>
        </form>

        <!-- 請假紀錄 -->
        <h3 style="margin:30px 0 15px; color:#1a5276;">📜 近期請假紀錄</h3>
        <div id="leaveHistory"></div>
    </section>

    <!-- Tab: 志工名冊 -->
    <section id="tab-roster" class="tab">
        <h2 class="section-title">👥 志工名冊</h2>
        <p class="section-desc">所有志工基本資料與班別</p>
        <div id="rosterList">
            <div class="loading">載入中...</div>
        </div>
    </section>

    <!-- Tab: 聯絡群組 -->
    <section id="tab-contact" class="tab">
        <h2 class="section-title">📞 聯絡群組</h2>
        <p class="section-desc">班別聯絡群組與緊急聯絡資訊</p>
        <div id="contactGroups">
            <div class="loading">載入中...</div>
        </div>
    </section>

    <!-- Tab: 管理（隱藏） -->
    <section id="tab-admin" class="tab">
        <h2 class="section-title">⚙️ 志工管理</h2>
        <div class="card">
            <h3>新增志工</h3>
            <form id="addVolunteerForm">
                <div class="form-row">
                    <div class="form-group"><label>姓名</label><input type="text" id="newName" required></div>
                    <div class="form-group"><label>電話</label><input type="tel" id="newPhone" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>電子郵件</label><input type="email" id="newEmail"></div>
                    <div class="form-group"><label>LINE ID</label><input type="text" id="newLine"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>主要班別</label>
                        <select id="newShift">
                            <option value="上午班">上午班</option>
                            <option value="下午班">下午班</option>
                            <option value="全天班">全天班</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>群組</label>
                        <select id="newGroup">
                            <option value="A組">A組</option>
                            <option value="B組">B組</option>
                            <option value="C組">C組</option>
                            <option value="D組">D組</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">➕ 新增志工</button>
            </form>
        </div>
    </section>

</div>

<footer>
    <p>© 2026 雙和醫院四下志工隊 ｜ 即時資料同步</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
